name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fixtures:
    name: validate fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Validate every fixture against the schema
        run: uv run --with jsonschema python scripts/validate_fixtures.py
      - name: Generated vectors must match the generator (no hand edits, no stale files)
        run: |
          uv run python scripts/generate_vectors.py
          git diff --exit-code -- fixtures
          test -z "$(git status --porcelain -- fixtures)"
